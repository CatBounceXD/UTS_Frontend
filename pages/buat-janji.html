<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Janji Temu - Hospitals</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    
    <style>
        body { background-color: #f8f9fa; }
        .booking-summary-card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            border-left: 5px solid #28a745;
        }
        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main style="padding: 2rem 0 4rem 0;">
        <div class="container" style="max-width: 800px;">
            
            <h1 style="margin-bottom: 0.5rem; color: var(--brand-dark);">Konfirmasi Janji Temu</h1>
            <p style="color: #666; margin-bottom: 2rem;">Periksa kembali jadwal pilihan Anda dan lengkapi data pasien.</p>

            <div class="booking-summary-card">
                <h3 style="margin-top: 0; color: var(--brand-dark); font-size: 1.2rem;">Detail Pilihan Dokter</h3>
                <p id="sum-name" style="font-weight: bold; font-size: 1.1rem; margin: 0.5rem 0; color: #1a2a5e;"></p>
                <p id="sum-loc" style="margin: 0.3rem 0; color: #555;"></p>
                <p id="sum-schedule" style="margin: 0.3rem 0; color: #28a745; font-weight: 500;">📅 Jadwal: Minggu, 04 Okt 2026 | Pukul 06:00 - 06:15 WIB</p>
            </div>

            <div class="form-container">
                <h3 style="margin-top: 0; margin-bottom: 1.5rem; color: var(--brand-dark);">Data Diri Pasien</h3>
                <form onsubmit="event.preventDefault(); alert('Berhasil! Janji temu Anda telah dikonfirmasi.'); window.location.href='cari-dokter.html';">
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label class="form-label">Nama Lengkap Pasien</label>
                        <input type="text" class="form-control" required placeholder="Masukkan nama lengkap...">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label class="form-label">Nomor Rekam Medis (Opsional)</label>
                        <input type="text" class="form-control" placeholder="Kosongkan jika pasien baru">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label class="form-label">Nomor Handphone (WhatsApp)</label>
                        <input type="tel" class="form-control" required placeholder="Contoh: 08123456789">
                    </div>
                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label class="form-label">Keluhan Utama</label>
                        <textarea class="form-control" rows="3" placeholder="Tuliskan keluhan kesehatan Anda..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">Konfirmasi & Buat Janji</button>
                </form>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/global.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('nama')) document.getElementById("sum-name").innerText = params.get('nama') + " (" + params.get('spesialis') + ")";
            if(params.get('lokasi')) document.getElementById("sum-loc").innerText = "📍 " + params.get('lokasi');
        });
    </script>
</body>
</html>
